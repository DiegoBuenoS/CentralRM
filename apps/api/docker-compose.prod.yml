services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: central-rm-api:latest
    container_name: central-rm-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      FRONTEND_ORIGIN: https://SEU_DOMINIO_WEB
      DATABASE_URL: postgres://central_rm_user:central_rm_pass@postgres:5432/central_rm
      DATABASE_SSL: "false"
      RM_API_BASE_URL: ${RM_API_BASE_URL:-http://dbs.brazilsouth.cloudapp.azure.com:8051}
      RM_AUTH_USERS_PATH: ${RM_AUTH_USERS_PATH:-/api/framework/v1/users}
      RM_CONSULTA_BASE_PATH: ${RM_CONSULTA_BASE_PATH:-/api/framework/v1/consultaSQLServer/RealizaConsulta}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      TRAVEL_REQUESTS_MAX: 10000
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: central-rm-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: central_rm
      POSTGRES_USER: central_rm_user
      POSTGRES_PASSWORD: central_rm_pass
    expose:
      - "5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./sql/init_postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central_rm_user -d central_rm"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: central-rm-postgres-backup-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: central_rm
      POSTGRES_USER: central_rm_user
      POSTGRES_PASSWORD: central_rm_pass
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - postgres_backup_prod:/backups

volumes:
  postgres_data_prod:
  postgres_backup_prod:
