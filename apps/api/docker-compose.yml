services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: central-rm-api
    restart: unless-stopped
    environment:
      PORT: 8787
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://central_rm_user:central_rm_pass@postgres:5432/central_rm
      DATABASE_SSL: "false"
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: central-rm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: central_rm
      POSTGRES_USER: central_rm_user
      POSTGRES_PASSWORD: central_rm_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central_rm_user -d central_rm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
